services:
  db:
    image: postgres:15-alpine
    container_name: codecollab-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codecollab
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codecollab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: codecollab-backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/codecollab
      JWT_SECRET: codecollab_super_secret_jwt_key_change_in_production
      CLIENT_URL: http://localhost:5173
      SERVER_URL: http://localhost:5000
      SESSION_SECRET: codecollab_session_secret_change_in_production
      GOOGLE_CLIENT_ID: enter here
      GOOGLE_CLIENT_SECRET: enter here
      # ── Internal sandbox tuning ──────────────────────────────────────────
      EXEC_TIMEOUT_MS: "5000"
      EXEC_MEMORY: "256m"
      EXEC_CPUS: "0.5"
      EXEC_PIDS: "64"
      EXEC_OUTPUT_MAX: "65536"
    ports:
      - "5000:5000"
    volumes:
      # Required so the backend can spawn sibling sandbox containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind-mount paths in `docker run -v ...` are resolved by the HOST
      # daemon. Sharing /tmp ensures os.tmpdir() inside the backend resolves
      # to the same path the daemon sees.
      - /tmp:/tmp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: codecollab-frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
